<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Portal - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 320px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    label {
      font-size: 14px;
      color: #555;
      display: block;
      margin-top: 15px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      margin-top: 20px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <div class="card">
    <h2>Student Portal</h2>
    <form action="dashboard.html" method="GET">
      <label for="student-id">Student ID</label>
      <input type="number" id="student-id" name="student_id" placeholder="e.g. 123456">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>


      <button type="submit">Access Portal</button>
    </form>
  </div>

</body>
</html>
